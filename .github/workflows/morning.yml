name: 朝の事前予想
on:
  schedule:
    - cron: "41 20 * * *"   # 毎日 5:41（日本時間）。混雑で30分ほど遅れることがあるので早めに
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py morning
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
      - name: 送った買い目をキャッシュに保存（夜の的中判定用・外部からは見えない）
        if: always()
        run: echo "key=bets-$(TZ=Asia/Tokyo date +%Y%m%d)-morning" >> $GITHUB_OUTPUT
        id: bk
      - uses: actions/cache/save@v4
        if: always() && hashFiles('bets/*.json') != ''
        with:
          path: bets
          key: ${{ steps.bk.outputs.key }}
