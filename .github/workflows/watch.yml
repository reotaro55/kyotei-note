name: 展示後予想の監視
on:
  schedule:
    - cron: "17 1 * * *"    # 10:17 開始 → 締切15:30までのレース
    - cron: "47 5 * * *"    # 14:47 開始 → 締切15:30〜18:30
    - cron: "47 8 * * *"    # 17:47 開始 → 締切18:30以降（ナイター）
  workflow_dispatch:
    inputs:
      t_from: { description: "締切がこの時刻以降（例 15:30）", default: "00:00" }
      t_to:   { description: "締切がこの時刻より前（例 18:30）", default: "24:00" }
      only:   { description: "指定レースだけ（例 13-11,13-12）", default: "" }
      full:   { description: "記事をまるごと送る（予約版を出していないとき）", type: boolean, default: false }
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 監視する時間帯を決める
        id: win
        run: |
          case "${{ github.event.schedule }}" in
            "17 1 * * *") echo "from=00:00" >> $GITHUB_OUTPUT; echo "to=15:30" >> $GITHUB_OUTPUT ;;
            "47 5 * * *") echo "from=15:30" >> $GITHUB_OUTPUT; echo "to=18:30" >> $GITHUB_OUTPUT ;;
            "47 8 * * *") echo "from=18:30" >> $GITHUB_OUTPUT; echo "to=24:00" >> $GITHUB_OUTPUT ;;
            *) echo "from=${{ inputs.t_from }}" >> $GITHUB_OUTPUT; echo "to=${{ inputs.t_to }}" >> $GITHUB_OUTPUT ;;
          esac
      - run: python main.py watch --from "${{ steps.win.outputs.from }}" --to "${{ steps.win.outputs.to }}" ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.full && '--full' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 送った買い目をキャッシュに保存（夜の的中判定用・外部からは見えない）
        if: always()
        run: echo "key=bets-$(TZ=Asia/Tokyo date +%Y%m%d)-watch$(echo "${{ steps.win.outputs.from }}" | tr -d :)" >> $GITHUB_OUTPUT
        id: bk
      - uses: actions/cache/save@v4
        if: always() && hashFiles('bets/*.json') != ''
        with:
          path: bets
          key: ${{ steps.bk.outputs.key }}
