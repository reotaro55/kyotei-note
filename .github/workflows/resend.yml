name: 記事の送り直し（手動）
on:
  workflow_dispatch:
    inputs:
      venue: { description: "場名（例: 尼崎）", required: true }
      from_rno: { description: "何Rから", default: "1" }
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 朝に送った買い目の記録を取り出す
        id: bk
        run: echo "key=bets-$(TZ=Asia/Tokyo date +%Y%m%d)-morning" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        with:
          path: bets
          key: ${{ steps.bk.outputs.key }}
      - run: python main.py resend --venue "${{ inputs.venue }}" --from-rno "${{ inputs.from_rno }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
