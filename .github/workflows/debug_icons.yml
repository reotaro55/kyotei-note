name: 風向きアイコンの取得
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir icons && cd icons
          for i in $(seq 1 17); do curl -sf -A "Mozilla/5.0 (compatible; kyotei-note-bot/1.0)" -o w$i.png "https://www.boatrace.jp/static_extra/pc/images/icon_wind1_$i.png"; sleep 1; done
          curl -sf -A "Mozilla/5.0 (compatible; kyotei-note-bot/1.0)" -o corner.png "https://www.boatrace.jp/static_extra/pc/images/img_corner1_2.png"
          ls -la
          git init -q && git config user.name kyotei-bot && git config user.email kyotei-bot@users.noreply.github.com
          git add . && git commit -qm icons
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:debug-icons
