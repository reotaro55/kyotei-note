name: 1場まるごと試し予想
on:
  workflow_dispatch:
    inputs:
      jcd: { description: "場コード（尼崎=13）", required: true }
      hd: { description: "日付 YYYYMMDD（空なら今日）", default: "" }
permissions:
  contents: write
concurrency: { group: "trial-${{ inputs.jcd }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 途中経過を取り出す
        run: |
          git config --global user.name "kyotei-bot"
          git config --global user.email "kyotei-bot@users.noreply.github.com"
          git fetch origin trial && git worktree add trial_wt origin/trial || (git worktree add --detach trial_wt && cd trial_wt && git switch --orphan trial)
          mkdir -p trial_wt/trial
      - run: |
          hd="${{ inputs.hd }}"; [ -z "$hd" ] && hd="$(TZ=Asia/Tokyo date +%Y%m%d)"
          python venue_trial.py --jcd "${{ inputs.jcd }}" --hd "$hd" --state trial_wt/trial --minutes 340 --push-dir trial_wt
