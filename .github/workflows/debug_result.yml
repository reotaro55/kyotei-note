name: 結果ページの調査
on:
  workflow_dispatch:
    inputs:
      jcd: { required: true }
      rno: { required: true }
      hd: { required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python debug_result.py "${{ inputs.jcd }}" "${{ inputs.rno }}" "${{ inputs.hd }}"
