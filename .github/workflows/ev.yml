name: 期待値バックテスト
on: workflow_dispatch
permissions:
  contents: write
concurrency: { group: reports, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -q && sudo apt-get install -y -q lhasa
      - run: pip install -r requirements.txt numpy
      - uses: actions/cache@v4
        with:
          path: history_cache
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: オッズとモデルを用意
        run: |
          git fetch origin odds-data reports
          git worktree add odds_wt origin/odds-data
          mkdir -p reports && git show origin/reports:reports/model.json > reports/model.json
      - run: python ev_backtest.py --model reports/model.json --odds odds_wt/odds_data
      - name: 結果を reports ブランチに保存
        run: |
          cp reports/ev_report.txt /tmp/
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git switch reports
          cp /tmp/ev_report.txt reports/
          git add reports && git commit -qm "ev report" && git push -q origin reports
