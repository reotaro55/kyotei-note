name: 確率モデルの学習
on:
  workflow_dispatch:
    inputs:
      train: { description: "学習期間 開始:終了", default: "2024-10-01:2025-09-30" }
      test: { description: "検証期間 開始:終了", default: "2025-10-01:2026-10-26" }
permissions:
  contents: write
concurrency: { group: reports, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -q && sudo apt-get install -y -q lhasa
      - run: pip install -r requirements.txt numpy
      - uses: actions/cache@v4
        with:
          path: history_cache
          key: history-${{ github.run_id }}
          restore-keys: history-
      - run: python train_model.py --train "${{ inputs.train }}" --test "${{ inputs.test }}"
      - name: 結果を reports ブランチに保存
        run: |
          cp reports/model.json reports/model_report.txt /tmp/
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git fetch origin reports || true
          git switch reports 2>/dev/null || git switch --orphan reports
          mkdir -p reports && cp /tmp/model.json /tmp/model_report.txt reports/
          git add reports && git commit -qm "model" && git push -q origin reports
