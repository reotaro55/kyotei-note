name: 1レース試し予想
on:
  workflow_dispatch:
    inputs:
      jcd: { description: "場コード（尼崎=13）", required: true }
      rno: { description: "レース番号", required: true }
      hd: { description: "日付 YYYYMMDD（空なら今日）", default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          hd="${{ inputs.hd }}"; [ -z "$hd" ] && hd="$(TZ=Asia/Tokyo date +%Y%m%d)"
          python try_race.py --jcd "${{ inputs.jcd }}" --rno "${{ inputs.rno }}" --hd "$hd"
